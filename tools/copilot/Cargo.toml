[package]
name = "neostar-copilot"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT"

[dependencies]
github-copilot-sdk = { version = "=1.0.28", default-features = false, features = ["runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }

[[bin]]
name = "neostar-copilot"
path = "src/main.rs"
